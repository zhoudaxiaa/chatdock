<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ChatDock</title>
<style>
  :root {
    --bg: #f4f4f4; --fg: #333; --muted: #888; --border: #dcdcdc; --hover: #e4e4e4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #e6e6e6; --muted: #8a8a8a; --border: #333; --hover: #2f2f2f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  body {
    display: flex; align-items: center; gap: 4px; padding: 0 8px;
    background: var(--bg); color: var(--fg); border-bottom: 1px solid var(--border);
    font: 13px/1 system-ui, "Microsoft YaHei", sans-serif;
  }
  /* 只给 macOS 红绿灯留位置；Windows 的窗口按钮由下面自绘 */
  body.darwin { padding-left: 84px; }
  /* 只有中间这块空白是窗口拖动区。
     不要把 drag 设在 body 上：那会把左侧标题/留白一并变成窗口非客户区，
     真实鼠标点上去会被窗口层吞掉，表现成「左上角有块区域点不了」。 */
  .drag-spacer {
    flex: 1; min-width: 24px;
    align-self: stretch;
    -webkit-app-region: drag;               /* 按住拖动窗口，双击最大化 / 还原 */
  }
  .title {
    font-weight: 600; padding: 0 8px 0 4px;
    cursor: default;                        /* 纯展示，不假装可点 */
  }
  button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px; border: 0; border-radius: 6px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
    -webkit-app-region: no-drag;            /* 按钮必须排除出拖动区，否则点不了 */
  }
  button:hover { background: var(--hover); }
  button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hint { color: var(--muted); font-size: 12px; }

  /* ===== 自绘窗口按钮（仅 Windows/Linux）===== */
  .win-controls { display: none; }
  body:not(.darwin) .win-controls {
    display: flex; align-self: stretch; margin-left: 8px;
  }
  .win-controls button.wc-btn {
    width: 46px; height: 100%; padding: 0; border-radius: 0; gap: 0;
    justify-content: center; align-items: center;
  }
  .win-controls button.wc-btn svg { width: 10px; height: 10px; stroke-width: 1.1; }
  .win-controls button.wc-close:hover { background: #e81123; color: #fff; }

  .providers { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; }
  .providers button { height: 24px; font-size: 12px; }
  .providers button[aria-pressed="true"] { background: var(--hover); font-weight: 600; }
  @media (max-width: 560px) { .title { display: none; } button { padding: 0 7px; } }
</style>
</head>
<body>
  <span class="title">ChatDock</span>
  <div class="providers" role="group" aria-label="聊天服务">
    <button data-provider="chatgpt" aria-pressed="true">ChatGPT</button>
    <button data-provider="claude" aria-pressed="false">Claude</button>
  </div>

  <button id="settings" title="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span>设置</span>
  </button>

  <div class="drag-spacer"></div>

  <button id="menu" title="功能菜单：截图、置顶、退出" aria-label="功能菜单">☰</button>
  <div class="win-controls">
    <button class="wc-btn" id="minBtn" title="最小化">
      <svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg>
    </button>
    <button class="wc-btn" id="maxBtn" title="最大化">
      <svg viewBox="0 0 10 10"><rect x="1.2" y="1.2" width="7.6" height="7.6"/></svg>
    </button>
    <button class="wc-btn wc-close" id="closeBtn" title="关闭窗口（隐藏到托盘，不会退出）">
      <svg viewBox="0 0 10 10"><path d="M1.2 1.2l7.6 7.6M8.8 1.2l-7.6 7.6"/></svg>
    </button>
  </div>

<script>
  document.body.classList.add(window.barApi.platform);
  document.getElementById('settings').addEventListener('click', () => window.barApi.openSettings());
  document.getElementById('menu').addEventListener('click', () => window.barApi.contextMenu());
  function showProvider(id) {
    document.querySelectorAll('[data-provider]').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.provider === id));
    });
  }
  window.barApi.getProvider().then(showProvider);
  window.barApi.onProvider(showProvider);
  document.querySelectorAll('[data-provider]').forEach(btn => btn.addEventListener('click', async () => {
    const result = await window.barApi.setProvider(btn.dataset.provider);
    if (!result.ok) { btn.title = result.error || '切换失败'; return; }
    showProvider(result.provider);
  }));

  // 顶栏右键 -> 设置 / 截图 / 隐藏 / 退出（退出入口，托盘图标被系统收起来时也能用）
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.barApi.contextMenu();
  });

  // 自绘窗口按钮
  const ICON_MAX = '<svg viewBox="0 0 10 10"><rect x="1.2" y="1.2" width="7.6" height="7.6"/></svg>';
  const ICON_RESTORE = '<svg viewBox="0 0 10 10"><rect x="1.2" y="2.8" width="6" height="6"/><path d="M3.2 2.8V1.2h5.6v5.6H7.2"/></svg>';
  const maxBtn = document.getElementById('maxBtn');

  document.getElementById('minBtn').addEventListener('click', () => window.barApi.windowAction('minimize'));
  maxBtn.addEventListener('click', () => window.barApi.windowAction('maximize'));
  document.getElementById('closeBtn').addEventListener('click', () => window.barApi.windowAction('close'));

  window.barApi.onMaximized((maximized) => {
    maxBtn.innerHTML = maximized ? ICON_RESTORE : ICON_MAX;
    maxBtn.title = maximized ? '向下还原' : '最大化';
  });
</script>
</body>
</html>
