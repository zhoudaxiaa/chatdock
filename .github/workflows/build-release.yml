name: Build & Release

on:
  # 明确的版本发布提交也可直接发布，供连接器推送代码时使用。
  push:
    branches: [main]
    paths: [package.json]
  # 发布 Release 时构建并把产物挂到 Release 页面
  release:
    types: [published]
  # 手动触发：只产出 Actions Artifacts，不写 Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  release:
    name: Prepare release
    if: "github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - name: Resolve and validate version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "Release tag does not match package.json" >&2
            exit 1
          fi
          test "$(head -n 1 RELEASE_NOTES.md)" = "## $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # 只取当前版本那一段作为正文，别把整本变更日志塞进 Release
          node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file release-notes.md

  # ---------------------------------------------------------------
  # 1) ChatDock 浏览器侧边栏扩展
  # ---------------------------------------------------------------
  extension:
    needs: release
    name: Package extension (chrome zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build sidebar extension
        run: node scripts/build-extension.mjs

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach extension to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------
  # 2) 桌面应用安装包：Windows x64 + macOS arm64
  # ---------------------------------------------------------------
  build:
    needs: release
    name: Build (${{ matrix.target }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 英特尔版 (x64)
          - os: windows-latest
            arch: x64
            target: win
          # macOS M 芯片版 (Apple Silicon / arm64)
          - os: macos-latest
            arch: arm64
            target: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.target }} ${{ matrix.arch }}
        run: pnpm build:${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload build artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

      - name: Attach installers to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          # 不要设 body_path：Release 正文由发布脚本写入（只含当前版本），
          # 这里再传一次会把整本变更日志盖上去。
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
