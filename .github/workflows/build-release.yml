name: Build & Release

on:
  # 明确的版本发布提交也可直接发布，供连接器推送代码时使用。
  push:
    branches: [main]
    paths: [package.json]
  # 发布 Release 时构建并把产物挂到 Release 页面
  release:
    types: [published]
  # 手动触发：只产出 Actions Artifacts，不写 Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  release:
    name: Prepare release
    if: "github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "Release tag does not match package.json" >&2
            exit 1
          fi
          test "$(head -n 1 RELEASE_NOTES.md)" = "## $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md

  # ---------------------------------------------------------------
  # 1) 浏览器扩展「ChatGPT Session Bridge」插件包
  # ---------------------------------------------------------------
  extension:
    needs: release
    name: Package extension (chrome zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(node -p "require('./browser-extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Package extension as zip
        run: |
          mkdir -p dist
          cd browser-extension
          zip -r "../dist/chatgpt-session-bridge-v${{ steps.meta.outputs.version }}.zip" . \
            -x "*.DS_Store" -x "__MACOSX/*"
          cd ..
          ls -lh dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach extension to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------
  # 2) 桌面应用安装包：Windows x64 + macOS arm64
  # ---------------------------------------------------------------
  build:
    needs: release
    name: Build (${{ matrix.target }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 英特尔版 (x64)
          - os: windows-latest
            arch: x64
            target: win
          # macOS M 芯片版 (Apple Silicon / arm64)
          - os: macos-latest
            arch: arm64
            target: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.target }} ${{ matrix.arch }}
        run: npm run build:${{ matrix.target }} -- --${{ matrix.arch }} --publish never

      - name: Upload build artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

      - name: Attach installers to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
