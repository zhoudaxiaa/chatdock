name: Build & Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # ---------------------------------------------------------------
  # 1) 浏览器扩展「ChatGPT Session Bridge」插件包
  # ---------------------------------------------------------------
  extension:
    name: Package extension (chrome zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(node -p "require('./browser-extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Package extension as zip
        run: |
          mkdir -p dist
          cd browser-extension
          zip -r "../dist/chatgpt-session-bridge-v${{ steps.meta.outputs.version }}.zip" . \
            -x "*.DS_Store" -x "__MACOSX/*"
          cd ..
          ls -lh dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach extension to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------
  # 2) 桌面应用安装包：Windows x64 + macOS arm64
  # ---------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 英特尔版 (x64)
          - os: windows-latest
            arch: x64
            target: win
          # macOS M 芯片版 (Apple Silicon / arm64)
          - os: macos-latest
            arch: arm64
            target: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.target }} ${{ matrix.arch }}
        run: npm run build:${{ matrix.target }} -- --${{ matrix.arch }}

      - name: Upload build artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

      - name: Attach installers to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
